# Dokploy deployment compose for freehire.
#
# Differences from the local-dev docker-compose.yml (kept as a separate file so
# local dev is untouched):
#   - No host `ports:` publishing. Dokploy runs this as an *isolated* compose, and
#     Traefik reaches the public `web` service over dokploy-network via the Domain
#     attached in the Dokploy UI. Every other service talks over the compose's own
#     network by service name, so nothing needs a published host port (and removing
#     them avoids clashes with the ~40 other stacks on this shared host).
#   - `app` gets COOKIE_SECURE passed through: the server refuses to start with an
#     https:// FRONTEND_ORIGIN unless the auth cookie is marked Secure.
#   - Public origin env (FRONTEND_ORIGIN / WEB_ORIGIN) comes from the Dokploy env.
#
# TLS is terminated at Cloudflare (edge); the origin serves plain HTTP on the web
# container's :80, same pattern as the openGym stack on this instance.

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: hire
      POSTGRES_PASSWORD: hire
      POSTGRES_DB: hire
    volumes:
      - pgdata:/var/lib/postgresql
      # NB: no ./migrations:/docker-entrypoint-initdb.d mount. Applying 222 files
      # via raw psql-on-init is order-fragile (one incompatible statement aborts
      # the whole init and leaves a half-built schema). The `migrate` service below
      # owns the schema instead — the project's real migration runner, one
      # transaction per file, honouring the no-transaction markers.
    networks:
      - default
      - crawl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hire -d hire"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.49.0
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-dev-insecure-meili-key}"
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/hire-resumes;
      exit 0;
      "

  # Versioned migration runner (cmd/migrate, baked into the app image at /app/migrate).
  # Runs once against the empty DB, applies every migrations/*.sql in order, then exits 0.
  # `app` waits for it to complete, so the server never starts against a partial schema.
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://hire:hire@db:5432/hire?sslmode=disable"

  app:
    build: .
    image: "${FREEHIRE_IMAGE:-freehire-worker:local}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment: &app-environment
      PORT: "8080"
      DATABASE_URL: "postgres://hire:hire@db:5432/hire?sslmode=disable"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://minio:9000}"
      S3_BUCKET: "${S3_BUCKET:-hire-resumes}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      PII_FILTER_URL: "${PII_FILTER_URL:-http://pii-filter:8099/detect}"
      # LLM-backed features stay disabled until these are set (catalogue works without them).
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      ASSISTANT_MODEL: "${ASSISTANT_MODEL:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      # Required by the auth surface (server fails fast if unset or under 32 bytes).
      JWT_SECRET: "${JWT_SECRET:?set a random 32+ byte JWT_SECRET in Dokploy env}"
      # Mark the session cookie Secure — mandatory with an https:// FRONTEND_ORIGIN.
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      # OAuth callbacks redirect the browser back to this origin.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:5173}"
      OAUTH_GOOGLE_CLIENT_ID: "${OAUTH_GOOGLE_CLIENT_ID:-}"
      OAUTH_GOOGLE_CLIENT_SECRET: "${OAUTH_GOOGLE_CLIENT_SECRET:-}"
      OAUTH_GITHUB_CLIENT_ID: "${OAUTH_GITHUB_CLIENT_ID:-}"
      OAUTH_GITHUB_CLIENT_SECRET: "${OAUTH_GITHUB_CLIENT_SECRET:-}"
      OAUTH_LINKEDIN_CLIENT_ID: "${OAUTH_LINKEDIN_CLIENT_ID:-}"
      OAUTH_LINKEDIN_CLIENT_SECRET: "${OAUTH_LINKEDIN_CLIENT_SECRET:-}"
      OAUTH_APPLE_CLIENT_ID: "${OAUTH_APPLE_CLIENT_ID:-}"
      OAUTH_APPLE_TEAM_ID: "${OAUTH_APPLE_TEAM_ID:-}"
      OAUTH_APPLE_KEY_ID: "${OAUTH_APPLE_KEY_ID:-}"
      OAUTH_APPLE_PRIVATE_KEY: "${OAUTH_APPLE_PRIVATE_KEY:-}"
      MEILI_URL: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-dev-insecure-meili-key}"
      REDIS_URL: "redis://redis:6379/0"
      SOURCES_PROXY_URL: "${SOURCES_PROXY_URL:-}"
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
      ADZUNA_APP_ID: "${ADZUNA_APP_ID:-}"
      ADZUNA_APP_KEY: "${ADZUNA_APP_KEY:-}"
      REED_API_KEY: "${REED_API_KEY:-}"
      USAJOBS_API_KEY: "${USAJOBS_API_KEY:-}"
      WHATJOBS_PUBLISHER_IDS: "${WHATJOBS_PUBLISHER_IDS:-}"
      GMAIL_TOKEN_KEY: "${GMAIL_TOKEN_KEY:-}"
      NOTIFY_EMAIL_FROM: "${NOTIFY_EMAIL_FROM:-}"
      MAILBOX_DOMAIN: "${MAILBOX_DOMAIN:-}"
      MAIL_INBOUND_QUEUE_URL: "${MAIL_INBOUND_QUEUE_URL:-}"
      MAIL_INBOUND_BUCKET: "${MAIL_INBOUND_BUCKET:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AUTO_APPLY_ORCHESTRATOR_SECRET: "${AUTO_APPLY_ORCHESTRATOR_SECRET:-}"
      INNGEST_EVENT_API_URL: "${INNGEST_EVENT_API_URL:-}"
      INNGEST_EVENT_KEY: "${INNGEST_EVENT_KEY:-}"
      INNGEST_SIGNING_KEY: "${INNGEST_SIGNING_KEY:-}"

  # Database claims bound the crawl fleet and survive container restarts. Only
  # this scheduler needs Docker access; each launched crawl runs as nonroot,
  # with one CPU, 2 GiB RAM, a timeout, and access only to the crawl network.
  scheduler:
    build: .
    image: "${FREEHIRE_IMAGE:-freehire-worker:local}"
    user: "0:0"
    restart: unless-stopped
    entrypoint: ["/app/supercronic", "/app/deploy/dokploy/scheduler.crontab"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      GOMAXPROCS: "2"
      INGEST_SCHEDULER_APPLY: "1"
      INGEST_SCHEDULER_CAP: "${INGEST_SCHEDULER_CAP:-4}"
      INGEST_DOCKER_IMAGE: "${FREEHIRE_IMAGE:-freehire-worker:local}"
      INGEST_DOCKER_NETWORK: "${FREEHIRE_CRAWL_NETWORK:-freehire-hire-crawl}"
      INGEST_DOCKER_PREFIX: "${FREEHIRE_CRAWL_PREFIX:-freehire-hire}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: 1
    mem_limit: 1g

  workers:
    build: .
    image: "${FREEHIRE_IMAGE:-freehire-worker:local}"
    restart: unless-stopped
    entrypoint: ["/app/supercronic", "/app/deploy/dokploy/workers.crontab"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      GOMAXPROCS: "2"
      ENRICH_CONCURRENCY: "2"
      APPLY_FORM_CONCURRENCY: "2"
      APPLY_FORM_MAX_PER_RUN: "500"
      MEILI_DATA_DIR: /meili_data
      REINDEX_MIN_FREE_GB: "70"
    volumes:
      - meilisearch_data:/meili_data:ro
    cpus: 2
    mem_limit: 4g

  pii-filter:
    build: ./services/pii-filter
    restart: unless-stopped
    cpus: 2
    mem_limit: 6g

  # SvelteKit SSR frontend + nginx (:80). This is the only public service; the
  # Dokploy Domain points hire.msantoki.com at it. nginx routes /api and /health
  # to the Go app and everything else to the Node SSR server.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      ORIGIN: "${WEB_ORIGIN:-http://localhost:8090}"
      API_INTERNAL_URL: "http://app:8080"
    depends_on:
      - app

volumes:
  pgdata:
  meilisearch_data:
  minio_data:

networks:
  crawl:
    name: "${FREEHIRE_CRAWL_NETWORK:-freehire-hire-crawl}"
